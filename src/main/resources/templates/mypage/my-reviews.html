<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내가 작성한 리뷰 - 코딩의 집</title>
    <link rel="stylesheet" th:href="@{/css/main/header.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/question/question-list.css}">
    <style>
        .review-image-preview {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .review-image-preview img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        .review-rating {
            color: #ffa500;
            font-size: 16px;
        }
        .review-content-preview {
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .product-name {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        /* 문의 목록 공용 .question-table 은 3번째 칸(제목)이 넓은 칸이라는 전제.
           리뷰 표는 5번째 칸(내용)이 한 줄 고정폭이라 제목 칸이 한 글자 폭으로 눌림 → 이 페이지에서만 칸 비율 지정 */
        .review-table { table-layout: fixed; }
        .review-table th:nth-child(1), .review-table td:nth-child(1) { width: 64px; }
        .review-table th:nth-child(2), .review-table td:nth-child(2) { width: 130px; }
        .review-table th:nth-child(3), .review-table td:nth-child(3) { width: 22%; }
        .review-table th:nth-child(4), .review-table td:nth-child(4) { width: 110px; }
        .review-table th:nth-child(5), .review-table td:nth-child(5) { width: auto; }
        .review-table th:nth-child(6), .review-table td:nth-child(6) { width: 104px; }
        .review-table th:nth-child(7), .review-table td:nth-child(7) { width: 96px; }
        .review-table .question-title-cell span {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: keep-all;
        }
        .review-table .review-content-preview { max-width: none; }
        .review-table .review-product-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 13px;
            color: #333;
            line-height: 1.4;
        }
        @media (max-width: 768px) {
            /* 좁은 화면: 번호 · 상품정보 · 작성일은 숨기고 제목 · 별점 · 내용 · 관리만 */
            .review-table th:nth-child(1), .review-table td:nth-child(1),
            .review-table th:nth-child(2), .review-table td:nth-child(2),
            .review-table th:nth-child(6), .review-table td:nth-child(6) { display: none; }
            .review-table th:nth-child(3), .review-table td:nth-child(3) { width: 30%; }
            .review-table th:nth-child(4), .review-table td:nth-child(4) { display: table-cell; width: 84px; }
            .review-table th:nth-child(5), .review-table td:nth-child(5) { width: auto; }
            .review-table th:nth-child(7), .review-table td:nth-child(7) { width: 76px; }
            .review-table .review-rating { font-size: 12px; }
        }
    </style>
</head>
<body class="page font-body">
<div th:replace="fragments/layout :: header"></div>

<!-- 메인 컨텐츠 -->
<main class="main-content">
    <div class="container">
        <div class="question-list-header">
            <div class="question-list-header-title">
                <h1 class="question-list-title">내가 작성한 리뷰</h1>
                <span class="question-total-count" th:text="'전체 ' + ${totalReviewCount} + '개'">전체 0개</span>
            </div>
            <div class="question-list-header-actions">
                <select class="form-select" onchange="changeSortOrder(this.value)">
                    <option value="latest" th:selected="${currentSort == 'latest'}">최신순</option>
                    <option value="oldest" th:selected="${currentSort == 'oldest'}">오래된순</option>
                    <option value="rating-high" th:selected="${currentSort == 'rating-high'}">별점 높은순</option>
                    <option value="rating-low" th:selected="${currentSort == 'rating-low'}">별점 낮은순</option>
                </select>
            </div>
        </div>

        <!-- 리뷰 목록 테이블 -->
        <div class="question-table-container">
            <table th:if="${reviews != null and !reviews.isEmpty()}" class="question-table review-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>상품정보</th>
                    <th>제목</th>
                    <th>별점</th>
                    <th>내용</th>
                    <th>작성일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="review, iterStat : ${reviews}">
                    <td th:text="${totalReviewCount - (currentPage - 1) * 10 - iterStat.index}">1</td>
                    <td>
                        <div th:if="${review.productName != null}" th:text="${review.productName}" th:title="${review.productName}" class="review-product-title">상품명</div>
                        <div th:if="${review.optionName != null}"
                             th:text="${review.optionValue != null} ? ${review.optionName + ': ' + review.optionValue} : ${review.optionName}"
                             class="product-name">상품 옵션</div>
                        <div th:if="${review.isPhotoReview}" class="review-image-preview">
                            <img th:each="imageUrl, idx : ${review.imageUrls}"
                                 th:if="${idx.index < 3}"
                                 th:src="${imageUrl}"
                                 alt="리뷰 이미지">
                        </div>
                    </td>
                    <td class="question-title-cell">
                        <span th:text="${review.title}">리뷰 제목</span>
                    </td>
                    <td>
                        <span class="review-rating" th:text="${review.starRating}">★★★★★</span>
                    </td>
                    <td>
                        <div class="review-content-preview" th:text="${review.content}">리뷰 내용</div>
                    </td>
                    <td th:text="${review.formattedCreatedAt}">2024-10-01</td>
                    <td>
                        <button class="btn-small" th:onclick="'viewProductDetail(' + ${review.productId} + ')'">상품보기</button>
                        <button class="btn-small" th:onclick="'editReview(' + ${review.reviewId} + ')'">수정</button>
                        <button class="btn-small" th:onclick="'deleteReview(' + ${review.reviewId} + ', ' + ${review.productId} + ')'">삭제</button>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- 리뷰가 없을 때 -->
            <div th:if="${reviews == null or reviews.isEmpty()}" class="empty-state">
                <div class="empty-content">
                    <div class="empty-icon">📝</div>
                    <h3>작성한 리뷰가 없습니다</h3>
                    <p>구매하신 상품에 대한 리뷰를 작성해보세요.</p>
                </div>
            </div>
        </div>

        <!-- 페이징 -->
        <div th:if="${totalPages != null and totalPages > 1}" class="question-pagination">
            <nav class="question-pagination-nav">
                <ul class="question-pagination-list">
                    <!-- 맨 처음으로 -->
                    <li class="question-page-item arrow">
                        <a th:href="@{/mypage/reviews(page=1, sort=${currentSort})}"
                           th:classappend="${currentPage == 1} ? 'disabled' : ''"
                           class="question-page-link">≪</a>
                    </li>

                    <!-- 이전 페이지 -->
                    <li class="question-page-item arrow">
                        <a th:href="@{/mypage/reviews(page=${currentPage - 1}, sort=${currentSort})}"
                           th:classappend="${currentPage == 1} ? 'disabled' : ''"
                           class="question-page-link">‹</a>
                    </li>

                    <!-- 페이지 번호 (현재 페이지 주변 5개만 표시) -->
                    <li th:each="pageNum : ${#numbers.sequence(
                        T(java.lang.Math).max(1, currentPage - 2),
                        T(java.lang.Math).min(totalPages, currentPage + 2)
                    )}"
                        th:classappend="${pageNum == currentPage} ? 'question-page-item active' : 'question-page-item'">
                        <a th:href="@{/mypage/reviews(page=${pageNum}, sort=${currentSort})}"
                           th:text="${pageNum}"
                           class="question-page-link">1</a>
                    </li>

                    <!-- 다음 페이지 -->
                    <li class="question-page-item arrow">
                        <a th:href="@{/mypage/reviews(page=${currentPage + 1}, sort=${currentSort})}"
                           th:classappend="${currentPage == totalPages} ? 'disabled' : ''"
                           class="question-page-link">›</a>
                    </li>

                    <!-- 맨 마지막으로 -->
                    <li class="question-page-item arrow">
                        <a th:href="@{/mypage/reviews(page=${totalPages}, sort=${currentSort})}"
                           th:classappend="${currentPage == totalPages} ? 'disabled' : ''"
                           class="question-page-link">≫</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:replace="fragments/layout :: footer"></div>

<script>
    function changeSortOrder(sort) {
        location.href = '/mypage/reviews?page=1&sort=' + sort;
    }

    function viewProductDetail(productId) {
        location.href = '/product/' + productId;
    }

    function editReview(reviewId) {
        location.href = '/reviews/' + reviewId + '/edit';
    }

    function deleteReview(reviewId, productId) {
        if (confirm('리뷰를 삭제하시겠습니까?')) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/reviews/' + reviewId + '/delete';

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'productId';
            input.value = productId;
            form.appendChild(input);

            document.body.appendChild(form);
            form.submit();
        }
    }
</script>

</body>
</html>
